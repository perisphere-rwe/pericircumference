<button onclick="scrollToToc()" id="tocButton" title="Click here to return to the top of the report">↑ Return to Table of Contents</button>

<script>
  function scrollToToc() {
    const title = document.querySelector("h1.title");
    if (title) {
      title.scrollIntoView({ behavior: "smooth" });
    }
  }
</script>
